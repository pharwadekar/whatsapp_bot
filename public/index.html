<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Approval UI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background: #f0f2f5; margin: 0; }
    h2 { margin-top: 0; text-align: center;}
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .meta { font-size: 12px; color: #666; margin-bottom: 10px; }
    .original { background: #e9ecef; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px;}
    textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; height: 100px; resize: vertical; margin-bottom: 10px; font-family: inherit;}
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    button { padding: 10px 15px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; flex: 1;}
    .approve { background: #25d366; color: white; }
    .reject { background: #ff4b4b; color: white; }
    .empty { text-align: center; color: #888; margin-top: 50px;}
  </style>
</head>
<body>
  <h2>Pending Approvals</h2>
  <div id="container">Loading...</div>

  <script>
    async function loadPending() {
      const res = await fetch('/api/pending');
      const data = await res.json();
      const container = document.getElementById('container');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty">No pending messages to approve.</div>';
        return;
      }

      container.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="meta">To: ${item.to}</div>
          <div class="original"><strong>Context/Trigger:</strong><br>${item.originalText}</div>
          <textarea id="reply-${item.id}">${item.replyText}</textarea>
          <div class="actions">
            <button class="reject" onclick="reject('${item.id}')">Reject</button>
            <button class="approve" onclick="approve('${item.id}')">Approve / Send</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function approve(id) {
      const text = document.getElementById('reply-' + id).value;
      const btn = document.querySelector(`button.approve`);
      if(btn) btn.innerText = "Sending...";
      await fetch('/api/approve/' + id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      loadPending();
    }

    async function reject(id) {
      await fetch('/api/reject/' + id, { method: 'POST' });
      loadPending();
    }

    loadPending();
    setInterval(loadPending, 5000); // Reload every 5 seconds
  </script>
</body>
</html>
